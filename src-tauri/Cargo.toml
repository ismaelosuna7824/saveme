[package]
# El paquete se llama saveme-desktop y no saveme a propósito: Tauri rechaza un
# sidecar con el mismo nombre que el paquete de Cargo. El ejecutable que ve el
# usuario se llama SaveMe (productName), y el core de Go sigue siendo `saveme`.
name = "saveme-desktop"
version = "0.1.0"
description = "SaveMe — diario técnico de proyecto, en markdown"
authors = ["SaveMe"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` es lo que permite una ventana translúcida en macOS.
# **Usa una API privada de Apple**: eso descarta publicar en la Mac App Store.
# Es un intercambio consciente —se distribuye por DMG— y está documentado en
# docs/ARCHITECTURE.md. Si algún día hace falta la App Store, se quita esta
# feature y la translucidez deja de funcionar.
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-dialog = "2.7.3"
tauri-plugin-notification = "2.4.0"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.11.0"
